name: Verify and publish a Maven theme

on:
  workflow_call:
    inputs:
      clean-verify:
        description: Run the clean lifecycle before verification.
        type: boolean
        default: false
    secrets:
      OSSRH_USERNAME:
        required: false
      OSSRH_PASSWORD:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Verify the Maven project
        run: ./mvnw -B ${{ inputs.clean-verify && 'clean verify' || 'verify' }}
      - name: Verify immutable release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" != *SNAPSHOT* ]]
      - name: Import signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -Pcentral-release deploy
